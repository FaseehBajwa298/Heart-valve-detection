<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Heart Valve Disorder Detection - Forgot Password</title>
    <link rel="stylesheet" href="../Style/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="background-animation">
            <div class="floating-shape shape1"></div>
            <div class="floating-shape shape2"></div>
            <div class="floating-shape shape3"></div>
            <div class="floating-shape shape4"></div>
        </div>

        <div class="auth-container">
            <div class="form-container">
                <div class="form-header">
                    <div class="logo">
                        <i class="fas fa-heartbeat"></i>
                        <h1>AI Heart Valve Detection</h1>
                    </div>
                    <p class="subtitle">Reset your password to regain access</p>
                </div>

                <div class="form-wrapper" id="forgotForm">
                    <h2 class="form-title">Forgot Password</h2>
                    <form class="auth-form">
                        <div class="input-group">
                            <div class="input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="forgotEmail" placeholder="Email Address" required>
                            </div>
                        </div>

                        <button type="submit" class="auth-btn primary">
                            <span>Send Reset Link</span>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>

                    <p class="switch-form">
                        Remember your password?
                        <a href="index.html">Back to Sign In</a>
                    </p>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-content"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
